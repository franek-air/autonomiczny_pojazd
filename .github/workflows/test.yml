name: Testy

on:
  push:
    branches: [main]

jobs:
  testy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalacja
        run: pip install -e ".[dev]"
      - name: Testy
        run: pytest