# x rośnie w prawo, y w dół. Jednostki: metry.
nazwa: magazyn_01

swiat:
  szerokosc: 40
  wysokosc: 25

szare_bloki:          # robot zna je z góry
  - {typ: prostokat, x: 10, y: 5,  szerokosc: 3, wysokosc: 12}   # regał
  - {typ: prostokat, x: 20, y: 8,  szerokosc: 3, wysokosc: 12}   # regał
  - {typ: prostokat, x: 30, y: 0,  szerokosc: 2, wysokosc: 15}   # ściana
  - {typ: okrag,     x: 15, y: 20, promien: 1.5}                 # słup

robot:
